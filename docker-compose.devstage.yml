services:
  # ----------------------- Traefik Reverse Proxy -----------------------
  traefik:
    image: traefik:3.6
    container_name: traefik
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/dynamic.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - traefik
    command:
      - '--configFile=/traefik.yml'

  # ----------------------- PostgreSQL -----------------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------- Redis -----------------------
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------- Minio (S3) -----------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------- Laravel Application (PHP-FPM) -----------------------
  app:
    image: ghcr.io/s0loparty/vibeup-api/app:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: app
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      HORIZON_ENABLED: true
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: example.com
      REVERB_PORT: 443
      REVERB_SCHEME: https
      FILESYSTEM_DISK: s3
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET}
      AWS_USE_PATH_STYLE_ENDPOINT: true
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./public/uploads:/var/www/html/public/uploads
    networks:
      - internal
    depends_on:
      - postgres
      - redis
      - minio

  # ----------------------- Nginx Webserver -----------------------
  webserver:
    image: nginx:alpine
    container_name: webserver
    restart: always
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - internal
      - traefik
    depends_on:
      - app
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.laravel.rule=Host(`msg.playerinlife.ru`)'
      - 'traefik.http.routers.laravel.entrypoints=websecure'
      - 'traefik.http.routers.laravel.tls.certresolver=letsencrypt'
      - 'traefik.http.services.laravel.loadbalancer.server.port=80'
      - 'traefik.docker.network=vibeup_traefik'

  # ----------------------- Laravel Horizon (Очереди) -----------------------
  horizon:
    image: ghcr.io/s0loparty/vibeup-api/app:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: horizon
    restart: always
    command: php artisan horizon
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    networks:
      - internal
    depends_on:
      - redis
      - app

  # ----------------------- Laravel Reverb (WebSocket) -----------------------
  reverb:
    image: ghcr.io/s0loparty/vibeup-api/app:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: reverb
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: msg.playerinlife.ru
      REVERB_PORT: 443
      REVERB_SCHEME: https
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    networks:
      - internal
      - traefik
    depends_on:
      - redis
      - app
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.reverb.rule=Host(`msg.playerinlife.ru`)'
      - 'traefik.http.services.reverb.loadbalancer.server.port=8080'
      - 'traefik.http.middlewares.reverb-websocket.headers.customrequestheaders.Upgrade=websocket'
      - 'traefik.http.middlewares.reverb-websocket.headers.customrequestheaders.Connection=Upgrade'
      - 'traefik.http.routers.reverb.middlewares=reverb-websocket'
      - 'traefik.docker.network=vibeup_traefik'

networks:
  traefik:
    external: false
  internal:
    external: false

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app-storage:
  traefik_certs:
    external: false

openapi: 3.0.3
info:
  title: 'VibeUp API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Авторизация
    description: ''
  -
    name: Сообщения
    description: ''
  -
    name: 'Текущий пользователь'
    description: ''
  -
    name: Чаты
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: Регистрация
      operationId: ''
      description: 'Регистрирует нового пользователя и возвращает токен доступа.'
      parameters: []
      responses:
        201:
          description: 'Пользователь зарегистрирован'
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 1
                    name: 'John Doe'
                    email: user@example.com
                    email_verified_at: null
                    created_at: '2026-03-11T11:36:31.000000Z'
                    updated_at: '2026-03-11T11:36:31.000000Z'
                  token:
                    token: 1|abc123xyz456
                    type: Bearer
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: user@example.com
                      email_verified_at:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-03-11T11:36:31.000000Z'
                      updated_at:
                        type: string
                        example: '2026-03-11T11:36:31.000000Z'
                  token:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abc123xyz456
                      type:
                        type: string
                        example: Bearer
        409:
          description: 'Пользователь с таким email уже существует'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Пользователь с таким email уже зарегистрирован'
                properties:
                  message:
                    type: string
                    example: 'Пользователь с таким email уже зарегистрирован'
        422:
          description: 'Ошибка валидации'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email field is required. (and 1 more error)'
                  errors:
                    email:
                      - 'The email field is required.'
                    password:
                      - 'The password field is required.'
                properties:
                  message:
                    type: string
                    example: 'The email field is required. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
                      password:
                        type: array
                        example:
                          - 'The password field is required.'
                        items:
                          type: string
      tags:
        - Авторизация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email адрес пользователя'
                  example: user@example.com
                password:
                  type: string
                  description: 'Пароль (минимум 8 символов)'
                  example: secret123
              required:
                - email
                - password
  /api/v1/auth/login:
    post:
      summary: Вход
      operationId: ''
      description: 'Аутентификация пользователя и получение токена доступа.'
      parameters: []
      responses:
        200:
          description: 'Успешный вход'
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 1
                    name: 'John Doe'
                    email: user@example.com
                    email_verified_at: '2026-03-11T11:36:31.000000Z'
                    created_at: '2026-03-11T11:36:31.000000Z'
                    updated_at: '2026-03-11T11:36:31.000000Z'
                  token:
                    token: 1|abc123xyz456
                    type: Bearer
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: user@example.com
                      email_verified_at:
                        type: string
                        example: '2026-03-11T11:36:31.000000Z'
                      created_at:
                        type: string
                        example: '2026-03-11T11:36:31.000000Z'
                      updated_at:
                        type: string
                        example: '2026-03-11T11:36:31.000000Z'
                  token:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abc123xyz456
                      type:
                        type: string
                        example: Bearer
        401:
          description: 'Неверные учётные данные'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Неверный email или пароль'
                properties:
                  message:
                    type: string
                    example: 'Неверный email или пароль'
        422:
          description: 'Ошибка валидации'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email field is required. (and 1 more error)'
                  errors:
                    email:
                      - 'The email field is required.'
                    password:
                      - 'The password field is required.'
                properties:
                  message:
                    type: string
                    example: 'The email field is required. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
                      password:
                        type: array
                        example:
                          - 'The password field is required.'
                        items:
                          type: string
      tags:
        - Авторизация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email адрес пользователя'
                  example: user@example.com
                password:
                  type: string
                  description: 'Пароль пользователя'
                  example: password
              required:
                - email
                - password
  /api/v1/auth/logout:
    post:
      summary: Выход
      operationId: ''
      description: 'Уничтожает текущий токен доступа (выход из системы).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Успешный выход'
                properties:
                  message:
                    type: string
                    example: 'Успешный выход'
        401:
          description: 'Пользователь не аутентифицирован'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Авторизация
  '/api/v1/chats/{chat_id}/messages':
    get:
      summary: 'Список сообщений чата'
      operationId: ''
      description: ''
      parameters:
        -
          in: query
          name: 'filter[type]'
          description: 'Фильтр по типу сообщения (text, image, video, etc.)'
          example: architecto
          required: true
          schema:
            type: string
            description: 'Фильтр по типу сообщения (text, image, video, etc.)'
            example: architecto
        -
          in: query
          name: 'filter[sender_id]'
          description: 'Фильтр по ID отправителя'
          example: 1
          required: true
          schema:
            type: string
            description: 'Фильтр по ID отправителя'
            example: 1
        -
          in: query
          name: 'filter[before]'
          description: 'Сообщения до указанного ID (для пагинации)'
          example: 123
          required: true
          schema:
            type: string
            description: 'Сообщения до указанного ID (для пагинации)'
            example: 123
        -
          in: query
          name: 'filter[after]'
          description: 'Сообщения после указанного ID (для пагинации)'
          example: 100
          required: true
          schema:
            type: string
            description: 'Сообщения после указанного ID (для пагинации)'
            example: 100
        -
          in: query
          name: include
          description: 'Включить связанные данные (sender, replyTo, chat)'
          example: 'sender,replyTo'
          required: true
          schema:
            type: string
            description: 'Включить связанные данные (sender, replyTo, chat)'
            example: 'sender,replyTo'
        -
          in: query
          name: sort
          description: 'Сортировка: id, created_at, updated_at (префикс - для убывания)'
          example: '-id'
          required: true
          schema:
            type: string
            description: 'Сортировка: id, created_at, updated_at (префикс - для убывания)'
            example: '-id'
        -
          in: query
          name: 'fields[messages]'
          description: 'Выбрать конкретные поля'
          example: 'id,body,type,created_at'
          required: true
          schema:
            type: string
            description: 'Выбрать конкретные поля'
            example: 'id,body,type,created_at'
      responses:
        200:
          description: 'Список сообщений с курсорной пагинацией'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 53
                      chat_id: 2
                      sender_id: 1
                      type: text
                      body: 'Привет, как дела?'
                      reply_to_id: null
                      edited_at: null
                      created_at: '2026-03-11T11:36:31.000000Z'
                      updated_at: '2026-03-11T11:36:31.000000Z'
                      sender:
                        id: 1
                        name: John
                        email: john@example.com
                  path: 'http://localhost/api/v1/chats/2/messages'
                  per_page: 30
                  next_cursor: eyJpZCI6NTN9
                  next_page_url: 'http://localhost/api/v1/chats/2/messages?cursor=eyJpZCI6NTN9'
                  prev_cursor: null
                  prev_page_url: null
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 53
                        chat_id: 2
                        sender_id: 1
                        type: text
                        body: 'Привет, как дела?'
                        reply_to_id: null
                        edited_at: null
                        created_at: '2026-03-11T11:36:31.000000Z'
                        updated_at: '2026-03-11T11:36:31.000000Z'
                        sender:
                          id: 1
                          name: John
                          email: john@example.com
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 53
                        chat_id:
                          type: integer
                          example: 2
                        sender_id:
                          type: integer
                          example: 1
                        type:
                          type: string
                          example: text
                        body:
                          type: string
                          example: 'Привет, как дела?'
                        reply_to_id:
                          type: string
                          example: null
                          nullable: true
                        edited_at:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-03-11T11:36:31.000000Z'
                        updated_at:
                          type: string
                          example: '2026-03-11T11:36:31.000000Z'
                        sender:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: John
                            email:
                              type: string
                              example: john@example.com
                  path:
                    type: string
                    example: 'http://localhost/api/v1/chats/2/messages'
                  per_page:
                    type: integer
                    example: 30
                  next_cursor:
                    type: string
                    example: eyJpZCI6NTN9
                  next_page_url:
                    type: string
                    example: 'http://localhost/api/v1/chats/2/messages?cursor=eyJpZCI6NTN9'
                  prev_cursor:
                    type: string
                    example: null
                    nullable: true
                  prev_page_url:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Сообщения
    post:
      summary: 'Создать сообщение'
      operationId: ''
      description: 'Отправляет новое сообщение в чат.'
      parameters: []
      responses:
        201:
          description: 'Сообщение создано'
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 456
                  chat_id: 1
                  sender_id: 2
                  type: text
                  body: 'Привет, как дела?'
                  reply_to_id: null
                  edited_at: null
                  created_at: '2026-03-11T11:36:31.000000Z'
                  updated_at: '2026-03-11T11:36:31.000000Z'
                  sender:
                    id: 2
                    name: John
                    email: john@example.com
                    created_at: '2026-02-28T10:30:00.000000Z'
                    updated_at: '2026-02-28T10:30:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 456
                  chat_id:
                    type: integer
                    example: 1
                  sender_id:
                    type: integer
                    example: 2
                  type:
                    type: string
                    example: text
                  body:
                    type: string
                    example: 'Привет, как дела?'
                  reply_to_id:
                    type: string
                    example: null
                    nullable: true
                  edited_at:
                    type: string
                    example: null
                    nullable: true
                  created_at:
                    type: string
                    example: '2026-03-11T11:36:31.000000Z'
                  updated_at:
                    type: string
                    example: '2026-03-11T11:36:31.000000Z'
                  sender:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: John
                      email:
                        type: string
                        example: john@example.com
                      created_at:
                        type: string
                        example: '2026-02-28T10:30:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-02-28T10:30:00.000000Z'
        403:
          description: 'Пользователь не является участником чата'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not a member of this chat'
                properties:
                  message:
                    type: string
                    example: 'Not a member of this chat'
        422:
          description: 'Ошибка валидации'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The body field is required.'
                  errors:
                    body:
                      - 'The body field is required.'
                properties:
                  message:
                    type: string
                    example: 'The body field is required.'
                  errors:
                    type: object
                    properties:
                      body:
                        type: array
                        example:
                          - 'The body field is required.'
                        items:
                          type: string
      tags:
        - Сообщения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 'Тип сообщения: text, image, video, audio, file'
                  example: text
                  enum:
                    - text
                    - image
                    - video
                    - audio
                    - file
                body:
                  type: string
                  description: 'Текст сообщения или описание медиа'
                  example: 'Привет, как дела?'
                reply_to_id:
                  type: integer
                  description: 'ID сообщения, на которое отвечаем'
                  example: 123
              required:
                - type
                - body
    parameters:
      -
        in: path
        name: chat_id
        description: 'The ID of the chat.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/messages/{id}':
    get:
      summary: 'Показать сообщение'
      operationId: ''
      description: 'Возвращает одно сообщение по ID.'
      parameters: []
      responses:
        200:
          description: 'Сообщение найдено'
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 456
                  chat_id: 1
                  sender_id: 2
                  type: text
                  body: 'Привет, как дела?'
                  reply_to_id: null
                  edited_at: null
                  created_at: '2026-03-11T11:36:31.000000Z'
                  updated_at: '2026-03-11T11:36:31.000000Z'
                  sender:
                    id: 2
                    name: John
                    email: john@example.com
                  reply_to: null
                properties:
                  id:
                    type: integer
                    example: 456
                  chat_id:
                    type: integer
                    example: 1
                  sender_id:
                    type: integer
                    example: 2
                  type:
                    type: string
                    example: text
                  body:
                    type: string
                    example: 'Привет, как дела?'
                  reply_to_id:
                    type: string
                    example: null
                    nullable: true
                  edited_at:
                    type: string
                    example: null
                    nullable: true
                  created_at:
                    type: string
                    example: '2026-03-11T11:36:31.000000Z'
                  updated_at:
                    type: string
                    example: '2026-03-11T11:36:31.000000Z'
                  sender:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: John
                      email:
                        type: string
                        example: john@example.com
                  reply_to:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Пользователь не является участником чата'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        404:
          description: 'Сообщение не найдено'
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - Сообщения
    put:
      summary: 'Редактировать сообщение'
      operationId: ''
      description: 'Обновляет текст сообщения. Только автор может редактировать.'
      parameters: []
      responses:
        200:
          description: 'Сообщение обновлено'
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 456
                  chat_id: 1
                  sender_id: 2
                  type: text
                  body: 'Обновлённый текст'
                  reply_to_id: null
                  edited_at: '2026-03-11T12:00:00.000000Z'
                  created_at: '2026-03-11T11:36:31.000000Z'
                  updated_at: '2026-03-11T12:00:00.000000Z'
                  sender:
                    id: 2
                    name: John
                    email: john@example.com
                properties:
                  id:
                    type: integer
                    example: 456
                  chat_id:
                    type: integer
                    example: 1
                  sender_id:
                    type: integer
                    example: 2
                  type:
                    type: string
                    example: text
                  body:
                    type: string
                    example: 'Обновлённый текст'
                  reply_to_id:
                    type: string
                    example: null
                    nullable: true
                  edited_at:
                    type: string
                    example: '2026-03-11T12:00:00.000000Z'
                  created_at:
                    type: string
                    example: '2026-03-11T11:36:31.000000Z'
                  updated_at:
                    type: string
                    example: '2026-03-11T12:00:00.000000Z'
                  sender:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: John
                      email:
                        type: string
                        example: john@example.com
        403:
          description: 'Только автор может редактировать'
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - Сообщения
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 'Новый текст сообщения'
                  example: 'Обновлённый текст'
    delete:
      summary: 'Удалить сообщение'
      operationId: ''
      description: 'Удаляет сообщение. Только автор или модератор/владелец.'
      parameters: []
      responses:
        200:
          description: 'Сообщение удалено'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'The message was successfully deleted.'
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'The message was successfully deleted.'
        403:
          description: 'Нет прав на удаление'
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - Сообщения
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the message.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/user:
    get:
      summary: 'Получить текущего пользователя'
      operationId: ''
      description: 'Возвращает данные текущего аутентифицированного пользователя.'
      parameters: []
      responses:
        200:
          description: 'Данные получены'
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: test
                  email: test@example.com
                  email_verified_at: '2026-02-28T20:21:48.000000Z'
                  last_seen_at: null
                  created_at: '2026-02-28T20:21:48.000000Z'
                  updated_at: '2026-02-28T20:21:48.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: test
                  email:
                    type: string
                    example: test@example.com
                  email_verified_at:
                    type: string
                    example: '2026-02-28T20:21:48.000000Z'
                  last_seen_at:
                    type: string
                    example: null
                    nullable: true
                  created_at:
                    type: string
                    example: '2026-02-28T20:21:48.000000Z'
                  updated_at:
                    type: string
                    example: '2026-02-28T20:21:48.000000Z'
        401:
          description: 'Пользователь не аутентифицирован'
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - 'Текущий пользователь'
    put:
      summary: 'Обновить текущего пользователя'
      operationId: ''
      description: 'Обновляет данные текущего аутентифицированного пользователя.'
      parameters: []
      responses:
        200:
          description: 'Данные обновлены'
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'John Doe'
                  email: john@example.com
                  email_verified_at: '2026-02-28T20:21:48.000000Z'
                  created_at: '2026-02-28T20:21:48.000000Z'
                  updated_at: '2026-02-28T20:25:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'John Doe'
                  email:
                    type: string
                    example: john@example.com
                  email_verified_at:
                    type: string
                    example: '2026-02-28T20:21:48.000000Z'
                  created_at:
                    type: string
                    example: '2026-02-28T20:21:48.000000Z'
                  updated_at:
                    type: string
                    example: '2026-02-28T20:25:00.000000Z'
        401:

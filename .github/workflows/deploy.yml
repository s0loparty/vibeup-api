name: Build and Deploy to VPS (improved)

on:
  push:
    branches: [ devstage ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_APP: ${{ github.repository }}/app
  IMAGE_NAME_WEB: ${{ github.repository }}/webserver
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Устанавливаем PHP 8.4 (соответствует вашему Dockerfile)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Generate cache keys
        id: cache_keys
        run: |
          echo "COMPOSER_HASH=${{ hashFiles('composer.lock') }}" >> $GITHUB_OUTPUT
          echo "NPM_HASH=${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ steps.cache_keys.outputs.COMPOSER_HASH }}
          restore-keys: composer-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ steps.cache_keys.outputs.NPM_HASH }}
          restore-keys: npm-

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Build frontend (Vite)
        run: npm run build
        env:
          VITE_APP_URL: https://msg.playerinlife.ru

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_APP }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push webserver image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for compose files)
        uses: actions/checkout@v4

      - name: Copy docker-compose.devstage.yml and configs to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.devstage.yml,docker/nginx,docker/traefik"
          target: ${{ secrets.VPS_PATH }}
          strip_components: 0
          overwrite: true

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}

            cat > .env << 'EOF'
            ${{ secrets.ENV_PRODUCTION }}
            EOF

            echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.devstage.yml pull

            docker compose -f docker-compose.devstage.yml up -d --remove-orphans

            echo "Waiting for app container..."
            for i in {1..30}; do
              if docker compose -f docker-compose.devstage.yml exec -T app php artisan --version >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            docker compose -f docker-compose.devstage.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.devstage.yml exec -T app php artisan optimize

            docker compose -f docker-compose.devstage.yml restart horizon reverb

            docker image prune -f

            echo "✅ Deployment completed successfully!"

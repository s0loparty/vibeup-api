services:
  app:
    image: ${IMAGE_REPOSITORY:-ghcr.io/s0loparty/vibeup-api}/dokploy-app:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment: &app-environment
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      # AWS_ENDPOINT: http://minio:9000
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio:
      #   condition: service_started

  webserver:
    image: ${IMAGE_REPOSITORY:-ghcr.io/s0loparty/vibeup-api}/dokploy-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - app

#   horizon:
#     image: ${IMAGE_REPOSITORY:-ghcr.io/s0loparty/vibeup-api}/dokploy-app:${IMAGE_TAG:-latest}
#     restart: unless-stopped
#     command: php artisan horizon
#     env_file: .env
#     environment: *app-environment
#     volumes:
#       - app-storage:/var/www/html/storage
#     depends_on:
#       app:
#         condition: service_started

  queue:
    image: ${IMAGE_REPOSITORY:-ghcr.io/s0loparty/vibeup-api}/dokploy-app:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=60
    stop_grace_period: 70s
    env_file: .env
    environment: *app-environment
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started

  reverb:
    image: ${IMAGE_REPOSITORY:-ghcr.io/s0loparty/vibeup-api}/dokploy-app:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    environment: *app-environment
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

#   minio:
#     image: minio/minio:latest
#     restart: unless-stopped
#     command: server /data --console-address ':9001'
#     environment:
#       MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
#       MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
#     volumes:
#       - minio-data:/data

volumes:
  app-storage:
  postgres-data:
  redis-data:
  # minio-data:

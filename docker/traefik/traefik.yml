api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

experimental:
  kubernetesGateway:
    enabled: false

providers:
  file:
    filename: /dynamic.yml
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: alabamaster1@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

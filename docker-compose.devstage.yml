services:
  # ----------------------- Traefik Reverse Proxy -----------------------
  traefik:
    image: traefik:3.6
    container_name: traefik
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/dynamic.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - traefik
    command:
      - '--configFile=/traefik.yml'

  # ----------------------- PostgreSQL -----------------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------- Redis -----------------------
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------- Minio (S3) -----------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    networks:
      - internal
      - traefik
    command: server /data --console-address ":9001"
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.minio.rule=Host(`msg-s3.playerinlife.ru`)'
      - 'traefik.http.routers.minio.entrypoints=websecure'
      - 'traefik.http.routers.minio.tls.certresolver=letsencrypt'
      - 'traefik.http.services.minio.loadbalancer.server.port=9001'
      - 'traefik.docker.network=vibeup_traefik'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------- Laravel Application (PHP-FPM) -----------------------
  app:
    image: ghcr.io/s0loparty/vibeup-api/app:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: app
    restart: always
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_URL: ${AWS_URL}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT}
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./public/uploads:/var/www/html/public/uploads
    networks:
      - internal
    depends_on:
      - postgres
      - redis
      - minio

  # ----------------------- Nginx Webserver -----------------------
  webserver:
    image: nginx:alpine
    container_name: webserver
    restart: always
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - internal
      - traefik
    depends_on:
      - app
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=vibeup_traefik'

      # --- Основной роутер (без авторизации) ---
      - 'traefik.http.routers.laravel.rule=Host(`msg.playerinlife.ru`)'
      - 'traefik.http.routers.laravel.entrypoints=websecure'
      - 'traefik.http.routers.laravel.tls.certresolver=letsencrypt'
      - 'traefik.http.services.laravel.loadbalancer.server.port=80'

      # --- Роутер для Horizon (с Basic Auth) ---
      - 'traefik.http.routers.horizon.rule=Host(`msg.playerinlife.ru`) && PathPrefix(`/horizon`)'
      - 'traefik.http.routers.horizon.entrypoints=websecure'
      - 'traefik.http.routers.horizon.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.horizon.middlewares=horizon-auth'
      - 'traefik.http.routers.horizon.service=laravel'
      - 'traefik.http.middlewares.horizon-auth.basicauth.users=${HORIZON_AUTH_USERS}'

  # ----------------------- Laravel Horizon (Очереди) -----------------------
  horizon:
    image: ghcr.io/s0loparty/vibeup-api/app:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: horizon
    restart: always
    command: php artisan horizon
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    networks:
      - internal
    depends_on:
      - redis
      - app

  # ----------------------- Laravel Reverb (WebSocket) -----------------------
  reverb:
    image: ghcr.io/s0loparty/vibeup-api/app:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: reverb
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT}
      REVERB_SCHEME: ${REVERB_SCHEME}
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    networks:
      - internal
      - traefik
    depends_on:
      - redis
      - app
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.reverb.rule=Host(`msg.playerinlife.ru`)'
      - 'traefik.http.services.reverb.loadbalancer.server.port=8080'
      - 'traefik.http.middlewares.reverb-websocket.headers.customrequestheaders.Upgrade=websocket'
      - 'traefik.http.middlewares.reverb-websocket.headers.customrequestheaders.Connection=Upgrade'
      - 'traefik.http.routers.reverb.middlewares=reverb-websocket'
      - 'traefik.docker.network=vibeup_traefik'

networks:
  traefik:
    external: false
  internal:
    external: false

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app-storage:
  traefik_certs:
    external: false

name: Build and Deploy

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # =========================================================
    # Job 1: Run Tests
    # =========================================================
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: sail
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: pdo_pgsql, gd, intl, bcmath, zip
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: |
                  composer install --optimize-autoloader --no-interaction --no-progress
                  npm ci --no-audit --progress=false

            - name: Build assets
              run: npm run build

            - name: Setup Laravel
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run migrations
              run: php artisan migrate --force
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: testing
                  DB_USERNAME: sail
                  DB_PASSWORD: password

            - name: Run tests
              run: php artisan test --parallel
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: testing
                  DB_USERNAME: sail
                  DB_PASSWORD: password

    # =========================================================
    # Job 2: Build and Push Docker Image
    # =========================================================
    build:
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push'
        permissions:
            contents: read
            packages: write

        outputs:
            image_tag: ${{ steps.meta.outputs.tags }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              run: |
                  if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                      echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT
                  elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
                      echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-staging" >> $GITHUB_OUTPUT
                  else
                      echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT
                  fi

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64
                  build-args: |
                      APP_ENV=production

    # =========================================================
    # Job 3: Deploy to Production VPS
    # =========================================================
    deploy-production:
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main'
        environment:
            name: production
            url: https://vibe.playerinlife.ru

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH key
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

            - name: Add server to known_hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

            - name: Create .env.production file on server
              run: |
                  ssh -o StrictHostKeyChecking=no root@${{ secrets.PRODUCTION_HOST }} "cat > /opt/vibe-api/.env.production << 'EOF'
              APP_KEY=${{ secrets.PRODUCTION_APP_KEY }}
              APP_ENV=production
              APP_DEBUG=false
              APP_URL=https://vibe.playerinlife.ru
              
              DB_CONNECTION=pgsql
              DB_HOST=pgsql
              DB_PORT=5432
              DB_DATABASE=${{ secrets.PRODUCTION_DB_DATABASE }}
              DB_USERNAME=${{ secrets.PRODUCTION_DB_USERNAME }}
              DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}
              
              REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }}
              
              MINIO_ACCESS_KEY=${{ secrets.PRODUCTION_MINIO_ACCESS_KEY }}
              MINIO_SECRET_KEY=${{ secrets.PRODUCTION_MINIO_SECRET_KEY }}
              MINIO_BUCKET=${{ secrets.PRODUCTION_MINIO_BUCKET }}
              
              FORWARD_DB_PORT=5432
              FORWARD_REDIS_PORT=6379
              FORWARD_MINIO_PORT=9000
              FORWARD_MINIO_CONSOLE_PORT=8900
              FORWARD_MAILPIT_PORT=1025
              FORWARD_MAILPIT_DASHBOARD_PORT=8025
              EOF"

            - name: Deploy to production server
              run: |
                  ssh -o StrictHostKeyChecking=no root@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
                  set -e
                  
                  # Create app directory
                  mkdir -p /opt/vibe-api
                  cd /opt/vibe-api
                  
                  # Copy docker-compose and Caddyfile
                  docker compose -f docker-compose.prod.yml down || true
                  
                  # Pull latest image
                  docker pull ghcr.io/${{ github.repository }}:latest
                  
                  # Run migrations
                  docker compose -f docker-compose.prod.yml run --rm app php artisan migrate --force
                  
                  # Optimize Laravel
                  docker compose -f docker-compose.prod.yml run --rm app php artisan optimize:clear
                  docker compose -f docker-compose.prod.yml run --rm app php artisan config:cache
                  docker compose -f docker-compose.prod.yml run --rm app php artisan route:cache
                  docker compose -f docker-compose.prod.yml run --rm app php artisan view:cache
                  
                  # Start services
                  docker compose -f docker-compose.prod.yml up -d
                  
                  # Clean up old images
                  docker image prune -af --filter "until=24h"
                  
                  echo "✅ Production deployment completed!"
                  ENDSSH

            - name: Verify deployment
              run: |
                  echo "Waiting 30 seconds for services to start..."
                  sleep 30
                  curl -f https://vibe.playerinlife.ru/api/v1/user || echo "⚠️ Health check failed, but deployment completed"

    # =========================================================
    # Job 4: Deploy to Staging VPS
    # =========================================================
    deploy-staging:
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/develop'
        environment:
            name: staging
            url: https://staging.vibe.playerinlife.ru

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH key
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

            - name: Add server to known_hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

            - name: Create .env.staging file on server
              run: |
                  ssh -o StrictHostKeyChecking=no root@${{ secrets.STAGING_HOST }} "cat > /opt/vibe-api/.env.staging << 'EOF'
              APP_KEY=${{ secrets.STAGING_APP_KEY }}
              APP_ENV=staging
              APP_DEBUG=true
              APP_URL=https://staging.vibe.playerinlife.ru
              
              DB_CONNECTION=pgsql
              DB_HOST=pgsql
              DB_PORT=5432
              DB_DATABASE=${{ secrets.STAGING_DB_DATABASE }}
              DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}
              DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
              
              REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
              
              MINIO_ACCESS_KEY=${{ secrets.STAGING_MINIO_ACCESS_KEY }}
              MINIO_SECRET_KEY=${{ secrets.STAGING_MINIO_SECRET_KEY }}
              MINIO_BUCKET=${{ secrets.STAGING_MINIO_BUCKET }}
              
              FORWARD_DB_PORT=5432
              FORWARD_REDIS_PORT=6379
              FORWARD_MINIO_PORT=9000
              FORWARD_MINIO_CONSOLE_PORT=8900
              FORWARD_MAILPIT_PORT=1025
              FORWARD_MAILPIT_DASHBOARD_PORT=8025
              EOF"

            - name: Deploy to staging server
              run: |
                  ssh -o StrictHostKeyChecking=no root@${{ secrets.STAGING_HOST }} << 'ENDSSH'
                  set -e
                  
                  # Create app directory
                  mkdir -p /opt/vibe-api
                  cd /opt/vibe-api
                  
                  # Pull latest image
                  docker pull ghcr.io/${{ github.repository }}:staging
                  
                  # Run migrations
                  docker compose -f docker-compose.staging.yml run --rm app php artisan migrate --force
                  
                  # Optimize Laravel
                  docker compose -f docker-compose.staging.yml run --rm app php artisan optimize:clear
                  
                  # Start services
                  docker compose -f docker-compose.staging.yml up -d
                  
                  # Clean up old images
                  docker image prune -af --filter "until=24h"
                  
                  echo "✅ Staging deployment completed!"
                  ENDSSH

            - name: Verify deployment
              run: |
                  echo "Waiting 30 seconds for services to start..."
                  sleep 30
                  curl -f https://staging.vibe.playerinlife.ru/api/v1/user || echo "⚠️ Health check failed, but deployment completed"
